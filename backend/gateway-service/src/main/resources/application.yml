# 服务名称
spring:
  application:
    name: gateway
  # redis配置
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      # 网关只做原样转发，不能让 Spring 提前解析 multipart：
      # 一旦被 MultipartResolver 包装，控制器就拿不到原始请求体，
      # 会导致 /blog/upload 这类文件上传在网关处直接 400。
      # 关掉后由下游服务（blog-service）自己解析 multipart。
      enabled: false

# 服务端口
server:
  port: 8889

# 转发目标（ServiceForwardController 用）
gateway:
  forward:
    # 系统服务：/system/** /auth/** /schedule/** /code/** /profile/avatar/** 等
    system-service: ${GATEWAY_SYSTEM_SERVICE:http://localhost:8000}
    # 博客服务：/blog/** 与 /profile/blog/**
    blog-service: ${GATEWAY_BLOG_SERVICE:http://localhost:8010}

#
cd:
  captcha:
    allowed-extensions:
      - "jpg"
      - "jpeg"
      - "png"
      - "webp"

# =====================================================================
# 日志配置
#
# 日志目录、按天切割、保留 30 天 都在 common/core 的 logback-spring.xml 里定义
# （三个服务共用），这里只声明级别，不要重复写 logging.file.path。
#
# 落盘位置：仓库根/logs/gateway-service.log（按天归档到 logs/history/）
# 需要换目录时用启动参数覆盖：-Dlogging.file.path=D:/temp/logs
#
# 网关是排查问题的第一站：前端所有请求都先到 8889，
# 所以这里把转发日志（cn.CDPersonal.gateway）也开到 debug，
# 能看到「请求打进来 -> 转发给哪个后端 -> 后端返回什么状态码 -> 耗时」。
# =====================================================================
logging:
  level:
    root: info
    cn.CDPersonal: debug
    cn.CDPersonal.request: debug
    # 转发链路日志：ServiceForwardController
    cn.CDPersonal.gateway: debug

