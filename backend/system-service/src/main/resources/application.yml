# 应用服务配置
# 全部支持环境变量覆盖：UAT 环境用 SYSTEM_PORT=8001、SYSTEM_DB_URL 指向 ry-cloud-uat、
# SYSTEM_REDIS_DATABASE=1 即可平行起一套，不影响 DEV（见 scripts/uat-up.ps1）。
server:
  port: ${SYSTEM_PORT:8000}
  servlet:
    context-path: /system

# Spring 核心配置
spring:
  # 应用基本信息
  application:
    name: system

  # 数据源配置
  # 指向 RuoYi-Cloud 的系统库 ry-cloud（含 sys_user / sys_menu / sys_role 等 31 张表）。
  # 原来的 system 库已废弃（只有 sys_dict_type / sys_dict_data 两张表）。
  datasource:
    url: ${SYSTEM_DB_URL:jdbc:mysql://localhost:3306/ry-cloud?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SYSTEM_DB_USERNAME:root}
    password: ${SYSTEM_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis：用于存放登录 token（键 login_tokens:<uuid>）
  # database 序号是 DEV/UAT 会话隔离的关键：UAT 用 db1，token 互不相通
  data:
    redis:
      host: ${SYSTEM_REDIS_HOST:localhost}
      port: ${SYSTEM_REDIS_PORT:6379}
      database: ${SYSTEM_REDIS_DATABASE:0}

  # Jackson 时区。
  # 数据源 URL 里 serverTimezone=Asia/Shanghai 是按东八区解析 DATETIME 的，
  # 但 Jackson 序列化 Date 默认用 UTC，导致接口返回的时间比库里少 8 小时
  # （库里 02:01:45，接口回 18:01:45）。后果是按界面显示的日期做时间范围筛选会对不上。
  # 显式指定东八区后，接口时间与库内时间一致。
  jackson:
    time-zone: GMT+8

# MyBatis：把库里的下划线字段自动映射到驼峰属性（sys_menu.menu_name -> menuName）
mybatis:
  configuration:
    map-underscore-to-camel-case: true

# =====================================================================
# 日志配置
#
# 日志目录、按天切割、保留 30 天 都在 common/core 的 logback-spring.xml 里定义
# （三个服务共用），这里只声明级别，不要重复写 logging.file.path。
#
# 落盘位置：仓库根/logs/system-service.log（按天归档到 logs/history/）
# 需要换目录时用启动参数覆盖：-Dlogging.file.path=D:/temp/logs
# =====================================================================
logging:
  level:
    root: info
    # 业务包：登录 / 鉴权 / 各模块 CRUD 的过程日志
    cn.CDPersonal: debug
    # 请求链路日志（RequestLoggingFilter）：每个请求一行 --> 和一行 <--
    cn.CDPersonal.request: debug
