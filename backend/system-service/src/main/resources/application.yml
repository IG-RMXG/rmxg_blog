# 应用服务配置
server:
  port: 8000
  servlet:
    context-path: /system

# Spring 核心配置
spring:
  # 应用基本信息
  application:
    name: system

  # 数据源配置 (根据实际数据库信息修改)
  datasource:
    url: jdbc:mysql://localhost:3306/system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
