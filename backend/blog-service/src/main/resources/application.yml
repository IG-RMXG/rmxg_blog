# =====================================================================
# blog-service —— 独立博客微服务
#
# 端口 8010，无 context-path：
#   /blog/**           业务接口（文章 / 分类 / 标签 / 评论 / 上传）
#   /profile/blog/**   上传图片的静态资源
# 网关（gateway-service）把上面两类路径转发到这里。
#
# 迁移提示：下面所有外部依赖都支持环境变量覆盖，
# 换机器/换库只需要设 BLOG_DB_* / BLOG_REDIS_*，不用改代码。
# =====================================================================
server:
  port: ${BLOG_PORT:8010}

spring:
  application:
    # 服务名同时决定日志文件名：logback 用 spring.application.name 拼出 logs/blog-service.log
    name: blog

  # 与 system-service 共用 ry-cloud 库：
  #   - 读写本模块自己的 blog_* 表
  #   - 只读 sys_user / sys_role / sys_user_role 用于鉴权（角色判定）
  datasource:
    url: ${BLOG_DB_URL:jdbc:mysql://localhost:3306/ry-cloud?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${BLOG_DB_USERNAME:root}
    password: ${BLOG_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 与 system-service 共用 Redis：登录 token 存在 login_tokens:<uuid>
  data:
    redis:
      host: ${BLOG_REDIS_HOST:localhost}
      port: ${BLOG_REDIS_PORT:6379}
      password: ${BLOG_REDIS_PASSWORD:}
      database: ${BLOG_REDIS_DATABASE:0}

  # 接口时间统一按东八区序列化。数据源 URL 里的 serverTimezone=Asia/Shanghai 只负责
  # 按东八区解析 DATETIME；Jackson 默认用 UTC 输出 Date，不显式指定会少 8 小时。
  jackson:
    time-zone: GMT+8

  # 上传体积上限：单文件 10MB、单次请求 10MB。
  # 超限时 Tomcat 在解析 multipart 阶段就抛 MaxUploadSizeExceededException，请求进不到 Controller。
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 下划线列名到驼峰属性的自动映射（cover_url -> coverUrl、publish_time -> publishTime）。
# blog_* 表全部按下划线命名、实体字段按驼峰写，关掉后这些列会映射成 null。
mybatis:
  configuration:
    map-underscore-to-camel-case: true

# 上传文件落盘目录：走 JVM 参数 -Dapp.upload.path=... 或环境变量 APP_UPLOAD_PATH，
# 未设置时用「进程工作目录/uploads」。（这里不用 spring 配置项，避免看起来生效其实没生效）

# 登录 token 有效期（分钟）。必须与 system-service 的 TokenService.EXPIRE_MINUTES 保持一致，
# 否则本服务刷新 token 过期时间时会与登录服务不一致。
blog:
  auth:
    token-expire-minutes: ${BLOG_TOKEN_EXPIRE_MINUTES:30}

  # 门户站点（/portal 前端）的品牌信息，容器化部署可用环境变量覆盖。
  # 只影响展示，不影响任何业务逻辑。
  portal:
    title: ${BLOG_PORTAL_TITLE:CDPersonal 的博客}
    subtitle: ${BLOG_PORTAL_SUBTITLE:记录、思考与分享 —— 写代码，也写生活}

# =====================================================================
# 日志配置
#
# 日志目录、按天切割、保留 30 天 这些都在 logback-spring.xml 里定义，
# 该文件位于 common/core 模块（三个服务共用），不要在这里重复声明
# logging.file.path，否则会和 logback 内部的仓库根推导打架。
#
# 落盘位置：仓库根/logs/blog-service.log（按天归档到 logs/history/）
# 需要换目录时用启动参数覆盖：-Dlogging.file.path=D:/temp/logs
# =====================================================================
logging:
  level:
    root: info
    # 业务包：打印接口进出参、Service 处理过程
    cn.CDPersonal: debug
    # 请求链路日志（RequestLoggingFilter），每一个 HTTP 请求都会有 --> / <-- 一对日志
    cn.CDPersonal.request: debug
